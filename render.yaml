# Render Blueprint for Medify. Configure DATABASE_URL and SECRET_KEY in the
# Render Dashboard before the first deploy. Create a Render PostgreSQL database
# separately and use its INTERNAL connection URL.
services:
  - type: web
    name: medify
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: FLASK_DEBUG
        value: "false"
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: UPLOAD_FOLDER
        value: /var/data/uploads
